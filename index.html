<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- ==================== FAVICON REFERENCES ==================== -->
    <!-- Standard favicon - all browsers (prevents 404 error) -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    
    <!-- SVG favicon - modern browsers -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" id="default-favicon" />
    
    <!-- Additional sizes for better compatibility -->
    <link rel="icon" type="image/svg+xml" sizes="16x16" href="/favicon.svg" id="favicon-16x16" />
    <link rel="icon" type="image/svg+xml" sizes="32x32" href="/favicon.svg" id="dynamic-favicon" />
    
    <!-- Apple Touch Icon (iOS, iPadOS) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.svg" id="apple-touch-icon" />
    
    <!-- Android Chrome -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1a3654" />
    <!-- ==================== END FAVICON ==================== -->
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>ZAMED - Premium Fashion Wear</title>
    <meta name="title" content="ZAMED - Premium Fashion Wear" />
    <meta name="description" content="Discover premium fashion at ZAMED. Shop the latest trends in men's, women's, and kids' clothing. Free shipping on orders over $100." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ZAMED.com/" />
    <meta property="og:title" content="ZAMED - Premium Fashion Wear" />
    <meta property="og:description" content="Discover premium fashion at ZAMED. Shop the latest trends in men's, women's, and kids' clothing." />
    <meta property="og:image" content="https://ZAMED.com/og-image.jpg" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://zamed.com/" />
    <meta property="twitter:title" content="ZAMED - Premium Fashion Wear" />
    <meta property="twitter:description" content="Discover premium fashion at ZAMED. Shop the latest trends." />
    <meta property="twitter:image" content="https://zamed.com/og-image.jpg" />
    
    <!-- Theme Color (for mobile browsers) -->
    <meta name="theme-color" content="#1a1a2e" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- ==================== FAVICON MANAGEMENT SCRIPT ==================== -->
    <script>
      // Function to update favicon dynamically
      window.updateFavicon = function(faviconUrl) {
        if (!faviconUrl) {
          console.log('No favicon URL provided');
          return;
        }
        
        console.log('🔄 Updating favicon...');
        
        // Update 32x32 favicon
        let favicon32 = document.getElementById('dynamic-favicon');
        if (!favicon32) {
          favicon32 = document.createElement('link');
          favicon32.id = 'dynamic-favicon';
          favicon32.rel = 'icon';
          favicon32.type = 'image/png';
          favicon32.sizes = '32x32';
          document.head.appendChild(favicon32);
        }
        favicon32.href = faviconUrl;
        
        // Update 16x16 favicon
        let favicon16 = document.getElementById('favicon-16x16');
        if (!favicon16) {
          favicon16 = document.createElement('link');
          favicon16.id = 'favicon-16x16';
          favicon16.rel = 'icon';
          favicon16.type = 'image/png';
          favicon16.sizes = '16x16';
          document.head.appendChild(favicon16);
        }
        favicon16.href = faviconUrl;
        
        // Update apple touch icon
        let appleIcon = document.getElementById('apple-touch-icon');
        if (!appleIcon) {
          appleIcon = document.createElement('link');
          appleIcon.id = 'apple-touch-icon';
          appleIcon.rel = 'apple-touch-icon';
          appleIcon.sizes = '180x180';
          document.head.appendChild(appleIcon);
        }
        appleIcon.href = faviconUrl;
        
        // Update default favicon
        let defaultFavicon = document.getElementById('default-favicon');
        if (defaultFavicon) {
          defaultFavicon.href = faviconUrl;
        }
        
        // Update standard ICO fallback
        let icoFavicon = document.querySelector('link[rel="icon"][type="image/x-icon"]');
        if (icoFavicon) {
          icoFavicon.href = faviconUrl;
        }
        
        console.log('✅ Favicon updated successfully');
      };
      
      // Function to load favicon from localStorage
      window.loadFaviconFromStorage = function() {
        try {
          const siteInfo = JSON.parse(localStorage.getItem('site_info') || '{}');
          const siteSettings = JSON.parse(localStorage.getItem('site_settings') || '{}');
          
          let favicon = siteInfo.favicon || siteSettings.favicon;
          
          if (favicon && favicon.startsWith('data:image')) {
            console.log('📦 Found favicon in localStorage');
            window.updateFavicon(favicon);
            return true;
          } else if (favicon && (favicon.startsWith('http') || favicon.startsWith('/'))) {
            console.log('📦 Found favicon URL:', favicon);
            window.updateFavicon(favicon);
            return true;
          } else {
            console.log('ℹ️ No custom favicon found, using default');
            return false;
          }
        } catch (error) {
          console.error('Error loading favicon:', error);
          return false;
        }
      };
      
      // Listen for storage events
      window.addEventListener('storage', function(event) {
        if (event.key === 'site_info' || event.key === 'site_settings') {
          console.log('📡 Storage event detected, reloading favicon');
          setTimeout(function() {
            window.loadFaviconFromStorage();
          }, 100);
        }
      });
      
      // Listen for custom events
      window.addEventListener('siteInfoUpdated', function(event) {
        console.log('📡 siteInfoUpdated event detected');
        if (event.detail && event.detail.favicon) {
          window.updateFavicon(event.detail.favicon);
        } else {
          setTimeout(function() {
            window.loadFaviconFromStorage();
          }, 100);
        }
      });
      
      window.addEventListener('settingsSaved', function() {
        console.log('📡 settingsSaved event detected');
        setTimeout(function() {
          window.loadFaviconFromStorage();
        }, 100);
      });
      
      // Load favicon immediately
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() {
          window.loadFaviconFromStorage();
        });
      } else {
        window.loadFaviconFromStorage();
      }
      
      // Also try after a delay for dynamic content
      setTimeout(function() {
        window.loadFaviconFromStorage();
      }, 500);
      
      console.log('🎯 Favicon manager initialized');
    </script>
    <!-- ==================== END FAVICON MANAGEMENT ==================== -->
  </body>
</html>
