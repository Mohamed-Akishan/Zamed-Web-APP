<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ==================== FAVICONS ==================== -->
    <!-- Data URI fallback - prevents 404 error -->
    <link
      rel="icon"
      type="image/x-icon"
      href="data:image/x-icon;base64,AAABAAEAEBAAAAEAIABoBAAAFgAAACgAAAAQAAAAIAAAAAEAIAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA////AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=="
    />
    
    <!-- SVG favicon - modern browsers -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <!-- Apple Touch Icon - iOS devices -->
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <!-- ==================== END FAVICONS ==================== -->

    <!-- ==================== PWA MANIFEST ==================== -->
    <!-- Make sure frontend/public/manifest.json exists and is valid JSON -->
    <link rel="manifest" href="/manifest.json" />
    <!-- ==================== END PWA MANIFEST ==================== -->

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Primary Meta Tags -->
    <title>ZAMED - Premium Fashion Wear</title>
    <meta name="title" content="ZAMED - Premium Fashion Wear" />
    <meta
      name="description"
      content="Discover premium fashion at ZAMED. Shop the latest trends in men's, women's, and kids' clothing. Free shipping on orders over $100."
    />
    <meta
      name="keywords"
      content="ZAMED, premium wear, fashion, clothing, men's fashion, women's fashion, kids clothing"
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://zamed-premium-wear.vercel.app/" />
    <meta property="og:title" content="ZAMED - Premium Fashion Wear" />
    <meta
      property="og:description"
      content="Discover premium fashion at ZAMED. Shop the latest trends in men's, women's, and kids' clothing."
    />
    <meta property="og:image" content="https://zamed-premium-wear.vercel.app/og-image.jpg" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ZAMED - Premium Fashion Wear" />
    <meta
      name="twitter:description"
      content="Discover premium fashion at ZAMED. Shop the latest trends."
    />
    <meta name="twitter:image" content="https://zamed-premium-wear.vercel.app/og-image.jpg" />

    <!-- Browser theme -->
    <meta name="theme-color" content="#1a1a2e" />

    <style>
      #root {
        min-height: 100vh;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
